# التقرير الأسبوعي على تيليجرام: كل أحد الساعة 8 صباحاً بتوقيت الرياض
# للتجربة: تبويب Actions ← التقرير الأسبوعي ← Run workflow
name: التقرير الأسبوعي
on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/weekly-report.mjs
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
